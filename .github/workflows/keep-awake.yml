name: Keep ARACHNODE awake
on:
  schedule:
    - cron: "*/10 11-23 * * 1-5"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the gateway
        run: curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://arachnode-gateway.onrender.com/challenge/ || true
